services:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  - type: web
    name: github-qa-bot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter          # 512MB RAM, upgrade if needed
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false        # set manually in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: EMBED_MODEL
        value: nomic-embed-text
      - key: RETRIEVAL_TOP_K
        value: "8"
      - key: DISTANCE_THRESHOLD
        value: "0.85"
      - key: CHUNK_SIZE
        value: "1500"
      - key: CHUNK_OVERLAP
        value: "200"
      - key: INDEX_API_KEY
        generateValue: true   # Render auto-generates a secret
      - key: CHROMA_HOST
        fromService:
          name: github-qa-bot-chromadb
          type: web
          property: hostport
      # OLLAMA_HOST intentionally unset — triggers sentence-transformers embeddings in prod

  # ── ChromaDB vector store ────────────────────────────────────────────────────
  - type: web
    name: github-qa-bot-chromadb
    runtime: image
    image:
      url: docker.io/chromadb/chroma:latest
    plan: starter
    disk:
      name: chroma-data
      mountPath: /chroma/chroma
      sizeGB: 10
    envVars:
      - key: IS_PERSISTENT
        value: "TRUE"
      - key: ANONYMIZED_TELEMETRY
        value: "FALSE"
