name: Re-index on Push

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.md"
      - "**.yaml"
      - "**.yml"

jobs:
  reindex:
    runs-on: ubuntu-latest

    services:
      chromadb:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v1/heartbeat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5

      - name: Pull embedding model
        run: ollama pull nomic-embed-text

      - name: Run indexer
        env:
          CHROMA_HOST: localhost
          CHROMA_PORT: 8000
          EMBED_MODEL: nomic-embed-text
        run: |
          cd backend
          python -m app.rag.indexer --repo ..

      - name: Run retrieval eval tests
        env:
          CHROMA_HOST: localhost
          CHROMA_PORT: 8000
          EMBED_MODEL: nomic-embed-text
          HIT_RATE_THRESHOLD: "0.80"
          MRR_THRESHOLD: "0.60"
        run: |
          cd backend
          pytest tests/test_retrieval.py -v --tb=short

      - name: Trigger Railway deploy (on success)
        if: success()
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_WEBHOOK_URL }}"
